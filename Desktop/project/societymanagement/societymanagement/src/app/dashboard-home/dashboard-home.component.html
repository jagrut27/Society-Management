<div class="announcements-section">
    <h2>Announcements</h2>
    <table>
      <thead>
        <tr>
            <th>ID</th>
          <th>Title</th>
          <th>Date</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let announcement of announcements">
            <td>{{announcement.announcement_Id}}</td>
          <td>{{ announcement.announcement_name }}</td>
          <td>{{ announcement.date }}</td>
          <td>{{ announcement.description }}</td>
        </tr>
      </tbody>
    </table>
  </div>
