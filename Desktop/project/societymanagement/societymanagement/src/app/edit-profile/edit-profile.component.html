
<form (ngSubmit)="updateProfile()" id="updatefrom">
  <h3>Edit Profile</h3>

  <label>First Name:</label>
  <input type="text" [(ngModel)]="updatedata.firstname" name="firstname" required />

  <label>Last Name:</label>
  <input type="text" [(ngModel)]="updatedata.lastname" name="lastname" required />

  <label>Phone Number:</label>
  <input type="text" [(ngModel)]="updatedata.phoneNumber" name="phoneNumber" required />

  <label>Flat Number:</label>
  <input type="text" [(ngModel)]="updatedata.flatNumber" name="flatNumber" required />

  <label>Block Number:</label>
  <input type="text" [(ngModel)]="updatedata.blockNumber" name="blockNumber" required />

  <!-- Change Password Field -->
  <!-- <label>New Password:</label>
  <input type="password" [(ngModel)]="updatedata.newPassword" name="newPassword" /> -->


  <label>Profile Image:</label>
  <input type="file" (change)="onFileSelected($event)" />

  <button type="submit">Update Profile</button>
  <button type="button" (click)="cancelEdit()">Cancel</button>
</form>
