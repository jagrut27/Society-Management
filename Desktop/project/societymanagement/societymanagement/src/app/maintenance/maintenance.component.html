<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="payment-container">
        <h2>Maintenance Payment</h2>
        <form [formGroup]="MaintenanceForm" class="payment-form">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" class="form-control" formControlName="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" class="form-control" formControlName="email" required>
            </div>
            <div class="form-group">
                <label>Flat No:</label>
                <input type="text" class="form-control" formControlName="FlatNo" required>
            </div>
            <div class="form-group">
                <label>Block:</label>
                <input type="text" class="form-control" formControlName="Block" required>
            </div>
            <div class="form-group">
                <label>Maintenance Amount:</label>
                <input type="text" class="form-control" formControlName="amount" required>
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date" class="form-control" formControlName="date" required>
            </div>
            <div class="form-group">
                <label>Payment Method:</label>
                <select class="form-control" formControlName="paymentMethod" required>
                    <option value="">Select Payment Method</option>
                    <option value="RazorPay">Razor Pay</option>
                    <option value="cash">Cash</option>
                </select>
            </div>
            <button type="button" (click)="payNow()" class="btn btn-success btn-block">Pay Now</button>
        </form>
        
    </div>

    <div class="payment-details-container">
        <h2>Payment History</h2>
        <table class="payment-table">
            <thead>
                <tr>
                    
                    <th>Name</th>
                    <th>Date</th>
                    <th>Flat No.</th>
                    <th>Block</th>
                    <th>Amount</th>
                 
                </tr>
            </thead>
            <tbody>
              <tr *ngFor="let payment of paymentHistory">
                <td>{{ payment.name }}</td>
                <td>{{ payment.paymentDate }}</td>
                <td>{{ payment.flatNumber }}</td>
                <td>{{ payment.blockNumber }}</td>
                <td>{{ payment.amount  }}</td>
              </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
