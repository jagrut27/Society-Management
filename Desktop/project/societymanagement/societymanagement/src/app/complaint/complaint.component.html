
<form id="content" (ngSubmit)="submitComplaint()">

    <h2 style="font-size: 50px;">Submit  Complaint</h2>
    <div class="underline"></div> <!-- Custom line inside the form -->

  <label for="title">Title:</label>
  <input type="text" id="title" [(ngModel)]="complaintData.title" name="title" required />

  <label for="description">Description:</label>
  <textarea id="description" [(ngModel)]="complaintData.description" name="description" required></textarea>

  <button type="submit">Submit Complaint</button>
</form>
<table class="table table-bordered">


  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Date</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let complaint of complaints">
    

      <td>{{complaint.title}}</td>
      <td>{{complaint.description }}</td>
      <td>{{complaint.created_at}}</td>
      <td [ngClass]="{'pending-status': complaint?.status?.toLowerCase() === 'pending', 'resolved-status': complaint?.status?.toLowerCase() === 'resolved'}">
        {{ complaint?.status }}
      </td>
    </tr>
  </tbody>
</table>
